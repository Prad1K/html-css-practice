<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <div class="page-content">
    <div class="banner-intro">
      <h1 class="banner-intro__title">Интернет-магазин КотоШап</h1>
      <div class="banner-intro__info">
        <img class="banner-intro__img" width="600" height="350" src="img/котик_в_шапочке.webp"
          alt="Здесь картинка КотоШап">
        <div class="banner-intro__product-inner">
          <h2 class="banner-intro__product-title">Стильные и теплые шапочки для ваших пушистых друзей!</h2>
          <p class="banner-intro__product-text">Подарите своим кошачьим спутникам не только уют и комфорт, но и стиль!
          </p>
          <span class="banner-intro__product-price">от 1990 руб.</span>
        </div>
      </div>
      <a class="banner-intro__link" href="#">Узнать подробнее</a>
      <p class="banner-intro__note">Хотите узнать больше? Нажмите на кнопку выше и сделайте выгодную покупку!</p>
    </div>
  </div>
</body>

</html>
