<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Погружение в Grid</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <section class="news">
    <h2 class="news__title"></h2>
    <div class="news__wrapper">
      <div class="news__banner">
        <img class="news__banner-img" width="250" height="80" src="https://placehold.co/250x80" alt="news-banner">
        <div class="news__banner-inner">
          <p class="news__banner-descr"></p>
          <a class="news__banner-link" href="#"></a>
        </div>
      </div>
      <aside class="news__nav"></aside>
      <div class="news__content">
        <ul class="news__content-list">
          <li class="news__content-item news__content-item--size-flat">
            <div class="gallery-card"></div>
          </li>
          <li class="news__content-item">
            <div class="gallery-card"></div>
          </li>
          <li class="news__content-item">
            <div class="gallery-card"></div>
          </li>
          <li class="news__content-item">
            <div class="gallery-card"></div>
          </li>
          <li class="news__content-item news__content-item--size-flat">
            <div class="gallery-card"></div>
          </li>
          <li class="news__content-item">
            <div class="gallery-card"></div>
          </li>
          <li class="news__content-item">
            <div class="gallery-card"></div>
          </li>
          <li class="news__content-item">
            <div class="gallery-card"></div>
          </li>
          <li class="news__content-item news__content-item--size-flat">
            <div class="gallery-card"></div>
          </li>
        </ul>
      </div>
      <div class="news__ad"></div>
      <div class="news__ad news__ad--size-xl"></div>
    </div>
  </section>
</body>

</html>
